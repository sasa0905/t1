<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>像素祕寶迷宮 - Pixel Treasure Hunt</title>
  <!-- 導入 Google 復古像素字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================
       1. 基礎變數與視覺主題定義
       ========================================== */
    :root {
      --bg-color: #0b150f;
      --card-bg: rgba(18, 32, 22, 0.85);
      --border-color: #f4c430;
      --text-color: #f0f0f0;
      --accent-color: #ff4757;
      --success-color: #2ed573;
    }

    /* 動態背景主題：森林 (Stage 1) */
    body.theme-forest {
      --bg-color: #07140b;
      --card-bg: rgba(15, 32, 20, 0.9);
      --border-color: #62d26f;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(46, 213, 115, 0.15), transparent 70%),
        radial-gradient(#15351c 15%, transparent 16%);
      background-size: 100% 100%, 24px 24px;
    }

    /* 動態背景主題：遺跡 (Stage 2) */
    body.theme-ruins {
      --bg-color: #19100c;
      --card-bg: rgba(38, 22, 16, 0.9);
      --border-color: #e67e22;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(230, 126, 34, 0.15), transparent 70%),
        radial-gradient(#381e14 15%, transparent 16%);
      background-size: 100% 100%, 24px 24px;
    }

    /* 動態背景主題：地底 (Stage 3 & 結局) */
    body.theme-cave {
      --bg-color: #080714;
      --card-bg: rgba(18, 15, 36, 0.9);
      --border-color: #9b59b6;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(155, 89, 182, 0.15), transparent 70%),
        radial-gradient(#1e1a38 15%, transparent 16%);
      background-size: 100% 100%, 24px 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Noto Sans TC', sans-serif;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.8s ease;
      overflow: hidden;
      position: relative;
    }

    /* ========================================================
       🚨 重點修改：碎石特效 Canvas 提升至絕對最上層，且不阻擋點擊
       ======================================================== */
    #fx-canvas {
      position: fixed; /* 改用 fixed 以免在部分瀏覽器跑位 */
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none; /* 確保玩家依然可以點擊下方的按鈕 */
      z-index: 9999;        /* 遠大於原本所有元素的 z-index，保證在最上層 */
    }

    /* 滿版 Arcade 框架 */
    .game-container {
      width: 100%;
      height: 100%;
      background-color: var(--card-bg);
      border: 6px solid var(--border-color);
      box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.9);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(4px);
      transition: border-color 0.8s ease;
      z-index: 1; /* 設為低層級，確保 Canvas 特效在其上方 */
    }

    /* 震動效果動畫 (Screen Shake) */
    .shake {
      animation: screenShake 0.35s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes screenShake {
      10%, 90% { transform: translate3d(-3px, 2px, 0); }
      20%, 80% { transform: translate3d(5px, -4px, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 5px, 0); }
      40%, 60% { transform: translate3d(6px, -3px, 0); }
    }

    /* CRT 掃描線效果 */
    .game-container::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
      opacity: 0.7;
    }

    /* 頂部資訊欄（放大標題與狀態） */
    .header {
      text-align: center;
      border-bottom: 3px dashed rgba(255,255,255,0.2);
      padding-bottom: 12px;
      position: relative;
      z-index: 5;
    }

    .game-title {
      font-family: 'Press Start 2P', 'Noto Sans TC', cursive;
      font-size: 2.2rem;
      color: var(--border-color);
      text-shadow: 4px 4px #000, -2px -2px #000;
      margin-bottom: 10px;
      letter-spacing: 2px;
      transition: color 0.8s ease;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 1.25rem;
      font-weight: 900;
      color: #aaa;
      font-family: monospace;
      max-width: 900px;
      margin: 0 auto;
    }

    /* 主畫面與卡片（放大圖示與打字文字） */
    .stage-card {
      background: rgba(0, 0, 0, 0.5);
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      z-index: 5;
    }

    /* 超巨大動態像素圖示 */
    .stage-icon {
      font-size: 8.5rem;
      margin-bottom: 15px;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8));
      animation: float 2.5s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-14px) scale(1.05); }
    }

    /* 故事文字區域 */
    .story-text-container {
      max-width: 900px;
      min-height: 4.5em;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .story-text {
      font-size: 1.55rem;
      font-weight: 700;
      line-height: 1.9;
      color: var(--text-color);
      text-align: center;
      text-shadow: 2px 2px 4px #000;
      white-space: pre-wrap;
    }

    /* 閃爍光標 */
    .typing-cursor {
      display: inline-block;
      width: 12px;
      height: 1.3em;
      background-color: var(--border-color);
      vertical-align: middle;
      margin-left: 6px;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* 結局稱號標籤 */
    .grade-badge {
      display: inline-block;
      font-family: 'Press Start 2P', cursive;
      font-size: 1.8rem;
      padding: 10px 20px;
      border-radius: 6px;
      margin-bottom: 20px;
      text-shadow: 2px 2px #000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .grade-SSR { background-color: #ff4757; color: #fff; border: 3px solid #ffa502; }
    .grade-SR { background-color: #1e90ff; color: #fff; border: 3px solid #70a1ff; }
    .grade-NORMAL { background-color: #747d8c; color: #fff; border: 3px solid #a4b0be; }
    .grade-BAD { background-color: #2f3542; color: #ff6b81; border: 2px solid #ff4757; }

    /* 按鈕控制區（放大按鈕） */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 950px;
      width: 100%;
      margin: 0 auto;
      position: relative;
      z-index: 5;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .btn {
      background-color: #2f3542;
      color: #fff;
      border: 3px solid var(--border-color);
      padding: 22px 16px;
      font-size: 1.3rem;
      font-weight: 900;
      font-family: inherit;
      cursor: pointer;
      border-radius: 6px;
      box-shadow: 0 6px 0 #000;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn:hover {
      background-color: var(--border-color);
      color: #000;
      transform: translateY(-3px);
      box-shadow: 0 9px 0 #000;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #000;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: 0 6px 0 #000 !important;
    }

    .btn-restart {
      grid-column: span 2;
      background-color: var(--success-color);
      border-color: #2ed573;
      color: #000;
    }

    .btn-restart:hover {
      background-color: #26af5f;
      color: #fff;
    }

    @media (max-width: 768px) {
      .game-title { font-size: 1.6rem; }
      .btn-group { grid-template-columns: 1fr; }
      .btn-restart { grid-column: span 1; }
      .stage-icon { font-size: 5.5rem; }
      .story-text { font-size: 1.2rem; }
      .btn { font-size: 1.1rem; padding: 18px 10px; }
    }
  </style>
</head>
<body class="theme-forest">

  <!-- 特效 Canvas（最上層，z-index: 9999） -->
  <canvas id="fx-canvas"></canvas>

  <div class="game-container" id="game-container">
    <div class="header">
      <h1 class="game-title">像素祕寶迷宮</h1>
      <div class="status-bar">
        <span id="stage-indicator">STAGE: 1 / 3</span>
        <span id="path-history">PATH: START</span>
      </div>
    </div>

    <!-- 點擊卡片可跳過打字動畫 -->
    <div class="stage-card" onclick="skipTypewriter()">
      <div id="grade-container"></div>
      <div class="stage-icon" id="stage-icon">🌲</div>
      <div class="story-text-container">
        <span class="story-text" id="story-text"></span><span class="typing-cursor" id="typing-cursor"></span>
      </div>
    </div>

    <div class="controls">
      <div class="btn-group" id="action-buttons">
        <button class="btn" onclick="makeChoice('L')">⬅️ 向左走 [A]</button>
        <button class="btn" onclick="makeChoice('R')">➡️ 向右走 [B]</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================
       1. 遊戲故事資料結構 (包含 Theme 定義)
       ========================================== */
    const storyTree = {
      "START": {
        stage: "1 / 3",
        theme: "theme-forest",
        icon: "🌲",
        text: "【綠林入口】你踏入傳說中的古代遺跡森林，四周樹影婆娑。前面的通道分成了兩條岔路...",
        leftBtn: "⬅️ 巨石通道",
        rightBtn: "➡️ 水晶溶洞"
      },
      "L": {
        stage: "2 / 3",
        theme: "theme-ruins",
        icon: "🏛️",
        text: "【巨石遺跡】牆上刻滿古老符文。空氣中泛著古舊塵土味，兩側各有一條狹窄走廊。",
        leftBtn: "⬅️ 探查古井",
        rightBtn: "➡️ 走向獸吼聲"
      },
      "R": {
        stage: "2 / 3",
        theme: "theme-ruins",
        icon: "💎",
        text: "【水晶溶洞】發光的晶石照亮暗渠，景色絢麗卻暗藏殺機。懸崖邊有兩條路可跨越。",
        leftBtn: "⬅️ 祭壇走廊",
        rightBtn: "➡️ 瀑布吊橋"
      },
      "LL": {
        stage: "3 / 3",
        theme: "theme-cave",
        icon: "🕳️",
        text: "【深層古井】面前出現兩尊古老的守護者石像，各自伸出一隻手指向不同的出口。",
        leftBtn: "⬅️ 太陽黃金門",
        rightBtn: "➡️ 月亮青銅門"
      },
      "LR": {
        stage: "3 / 3",
        theme: "theme-cave",
        icon: "🦇",
        text: "【地底狹道】盡頭居然是一隻沉睡的巨型岩石怪！巨獸身後有兩個通往深處的洞口。",
        leftBtn: "⬅️ 鑽左側狹縫",
        rightBtn: "➡️ 快速衝過右側"
      },
      "RL": {
        stage: "3 / 3",
        theme: "theme-cave",
        icon: "🔮",
        text: "【地底祭壇】中央擺著一本散發紫光的魔導書，左右兩側各有一個神秘機關按鈕。",
        leftBtn: "⬅️ 紅寶石按鈕(力量)",
        rightBtn: "➡️ 藍寶石按鈕(智慧)"
      },
      "RR": {
        stage: "3 / 3",
        theme: "theme-cave",
        icon: "🌉",
        text: "【瀑布吊橋】吊橋搖搖欲墜，你順利抵達對岸。面前出現兩條濕滑的石階梯。",
        leftBtn: "⬅️ 向上石階",
        rightBtn: "➡️ 向下石階"
      },

      // --- 8 大結局 ---
      "LLL": {
        isEnding: true,
        theme: "theme-cave",
        grade: "SSR",
        icon: "👑",
        title: "失落的法老寶藏",
        text: "門後堆滿了黃金與古代法老的皇冠！你成功帶走無數財寶，成為世上最富有、最傳奇的冒險家！"
      },
      "LLR": {
        isEnding: true,
        theme: "theme-cave",
        grade: "BAD",
        icon: "⏳",
        title: "時光詛咒",
        text: "月亮石門觸發了古代時間陷阱！你的身體逐漸變成石頭，永遠成為了遺跡的一部分..."
      },
      "LRL": {
        isEnding: true,
        theme: "theme-cave",
        grade: "SR",
        icon: "🐾",
        title: "巨獸馴服者",
        text: "你靈巧地鑽過狹縫，意外發現了巨獸幼崽並給予餵食。巨獸醒來後將你視為主人，護送你帶滿口袋寶石平安離開！"
      },
      "LRR": {
        isEnding: true,
        theme: "theme-cave",
        grade: "BAD",
        icon: "🕳️",
        title: "陷阱坑洞",
        text: "你的腳步聲驚醒了巨獸！狂暴的巨獸一巴掌踩塌了地面，你落入無底深淵..."
      },
      "RLL": {
        isEnding: true,
        theme: "theme-cave",
        grade: "BAD",
        icon: "💥",
        title: "貪婪的代價",
        text: "紅寶石按鈕引爆了遺跡自爆機關！強烈的地震讓整個洞穴坍塌，你與寶藏一同被埋葬。"
      },
      "RLR": {
        isEnding: true,
        theme: "theme-cave",
        grade: "SSR",
        icon: "🧙‍♂️",
        title: "大賢者傳承",
        text: "智慧按鈕開啟了法術試煉，你獲得了古代大賢者的畢生魔法傳承與無價的知識魔法書！"
      },
      "RRL": {
        isEnding: true,
        theme: "theme-cave",
        grade: "NORMAL",
        icon: "🏛️",
        title: "空無一物的密室",
        text: "向上走進密室，裡面只有空箱子與一張寫著「有人先來過了」的紙條。雖然沒拿到寶藏，但你平安無事地離開了。"
      },
      "RRR": {
        isEnding: true,
        theme: "theme-cave",
        grade: "SR",
        icon: "🧜‍♀️",
        title: "人魚之歌與地底湖",
        text: "向下的石階通往神秘的地底螢光湖，地底人魚贈予你一顆巨大的避水珍珠，賣出了無可估量的高價！"
      }
    };

    /* ==========================================
       2. 碎石粒子系統 (Canvas Gravel FX)
       ========================================== */
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = -15; // 稍微在畫面上方一點生成，避免突兀
        this.size = Math.random() * 8 + 4; // 稍微調大一點，更有存在感
        this.speedY = Math.random() * 9 + 5; // 下落速度
        this.speedX = (Math.random() - 0.5) * 5;
        // 碎石的顏色（灰色、暗紅、金黃，增加遺跡掉落感）
        const colors = ['#696969', '#808080', '#a9a9a9', '#3e2723', '#d35400', '#f4c430'];
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.opacity = 1.0;
        this.rotation = Math.random() * 360;
        this.rotationSpeed = (Math.random() - 0.5) * 10;
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.rotation += this.rotationSpeed;
        this.opacity -= 0.012; // 掉落時漸隱
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = Math.max(0, this.opacity);
        // 繪製像素風格的正方形碎石
        ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
        ctx.restore();
      }
    }

    function triggerDebrisEffect() {
      // 產生 45 顆最上層的碎石粒子
      for (let i = 0; i < 45; i++) {
        particles.push(new Particle());
      }
      // 觸發畫面震動
      const container = document.getElementById('game-container');
      container.classList.remove('shake');
      void container.offsetWidth; // 觸發 reflow
      container.classList.add('shake');
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].opacity <= 0 || particles[i].y > canvas.height + 20) {
          particles.splice(i, 1);
        }
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /* ==========================================
       3. 遊戲邏輯與打字機控管
       ========================================== */
    let currentPath = "START";
    let typewriterTimer = null;
    let fullText = "";
    let isTyping = false;
    const typingSpeed = 35; // 每字 35 毫秒

    function typeWriter(text, index = 0) {
      const textElement = document.getElementById('story-text');
      const cursorElement = document.getElementById('typing-cursor');
      
      if (index === 0) {
        textElement.textContent = "";
        cursorElement.style.display = "inline-block";
        isTyping = true;
        toggleButtons(true);
      }

      if (index < text.length) {
        textElement.textContent += text.charAt(index);
        typewriterTimer = setTimeout(() => {
          typeWriter(text, index + 1);
        }, typingSpeed);
      } else {
        isTyping = false;
        cursorElement.style.display = "none";
        toggleButtons(false);
      }
    }

    function skipTypewriter() {
      if (isTyping) {
        clearTimeout(typewriterTimer);
        document.getElementById('story-text').textContent = fullText;
        document.getElementById('typing-cursor').style.display = "none";
        isTyping = false;
        toggleButtons(false);
      }
    }

    function toggleButtons(disabled) {
      const buttons = document.querySelectorAll('#action-buttons button');
      buttons.forEach(btn => btn.disabled = disabled);
    }

    function renderNode() {
      if (typewriterTimer) clearTimeout(typewriterTimer);

      const node = storyTree[currentPath];
      fullText = node.text;

      // 自動切換動態背景主題
      document.body.className = node.theme;

      document.getElementById('stage-icon').textContent = node.icon;
      
      if (node.isEnding) {
        document.getElementById('stage-indicator').textContent = "STAGE: END";
        document.getElementById('path-history').textContent = `PATH: ${formatPath(currentPath)}`;
        
        document.getElementById('grade-container').innerHTML = 
          `<span class="grade-badge grade-${node.grade}">${node.grade} - ${node.title}</span>`;
        
        document.getElementById('action-buttons').innerHTML = 
          `<button class="btn btn-restart" onclick="restartGame()">🔄 重新開始冒險</button>`;
      } else {
        document.getElementById('stage-indicator').textContent = `STAGE: ${node.stage}`;
        document.getElementById('path-history').textContent = `PATH: ${formatPath(currentPath)}`;
        document.getElementById('grade-container').innerHTML = "";

        document.getElementById('action-buttons').innerHTML = `
          <button class="btn" onclick="makeChoice('L')">${node.leftBtn || "⬅️ 向左走"}</button>
          <button class="btn" onclick="makeChoice('R')">${node.rightBtn || "➡️ 向右走"}</button>
        `;
      }

      typeWriter(fullText);
    }

    function makeChoice(direction) {
      if (isTyping) return;
      
      // 觸發最上層碎石掉落與地震特效
      triggerDebrisEffect();

      if (currentPath === "START") {
        currentPath = direction;
      } else {
        currentPath += direction;
      }
      renderNode();
    }

    function restartGame() {
      triggerDebrisEffect();
      currentPath = "START";
      renderNode();
    }

    function formatPath(path) {
      if (path === "START") return "START";
      return path.split('').map(char => char === 'L' ? '⬅️' : '➡️').join(' ');
    }

    // 啟動遊戲
    renderNode();
  </script>
</body>
</html>
