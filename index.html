<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>像素祕寶迷宮 - Pixel Treasure Hunt</title>
  <!-- 導入 Google 復古像素字體與繁體中文 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================
       1. 主題配色與變數設定
       ========================================== */
    :root {
      /* 預設森林風格背景 (Stage 1) */
      --bg-color: #0b1a10;
      --card-bg: #112417;
      --border-color: #50c878;
      --text-color: #e2f7e2;
      --accent-color: #ff4757;
      --success-color: #2ed573;
      --highlight-color: #f4c430;
      --transition-speed: 0.8s;
    }

    /* 背景主題 2：古代遺跡 (Stage 2) */
    body.theme-ruins {
      --bg-color: #1c1917;
      --card-bg: #292524;
      --border-color: #f4c430;
      --text-color: #f5f5f4;
    }

    /* 背景主題 3：地底深淵 (Stage 3 & Endings) */
    body.theme-underground {
      --bg-color: #0f0f1b;
      --card-bg: #1a1a2e;
      --border-color: #ff4757;
      --text-color: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Noto Sans TC', sans-serif;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color var(--transition-speed) ease;
      overflow: hidden;
      position: relative;
    }

    /* 碎石粒子 Canvas 畫布 */
    #gravel-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* 滿版 Arcade 框架 */
    .game-container {
      width: 100%;
      height: 100%;
      background-color: var(--card-bg);
      border: 6px solid var(--border-color);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0,0,0,0.9);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      overflow: hidden;
      transition: background-color var(--transition-speed) ease, border-color var(--transition-speed) ease;
      z-index: 10;
    }

    /* 畫面震撼動畫 (Screen Shake) */
    .shake-animation {
      animation: screenShake 0.4s ease-in-out;
    }

    @keyframes screenShake {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-8px, 6px); }
      40% { transform: translate(8px, -6px); }
      60% { transform: translate(-5px, -4px); }
      80% { transform: translate(5px, 4px); }
      100% { transform: translate(0, 0); }
    }

    /* 掃描線效果 (Scanlines) */
    .game-container::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      z-index: 20;
      pointer-events: none;
      opacity: 0.7;
    }

    /* 頂部標題與狀態 */
    .header {
      text-align: center;
      border-bottom: 3px dashed var(--border-color);
      padding-bottom: 12px;
      transition: border-color var(--transition-speed) ease;
    }

    .game-title {
      font-family: 'Press Start 2P', 'Noto Sans TC', cursive;
      font-size: 1.8rem;
      color: var(--highlight-color);
      text-shadow: 3px 3px #000;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-color);
      font-family: monospace;
      max-width: 900px;
      margin: 0 auto;
      opacity: 0.9;
    }

    /* 主畫面與插圖（填滿剩餘空間） */
    .stage-card {
      background: rgba(0, 0, 0, 0.4);
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    /* 超大像素 / Emoji 圖示 */
    .stage-icon {
      font-size: 6.5rem;
      margin-bottom: 20px;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.8));
      animation: bounce 2.5s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    /* 文字打字機區域與放大字體 */
    .story-text-container {
      max-width: 900px;
      min-height: 4.5em;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .story-text {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.8;
      color: var(--text-color);
      text-align: center;
      white-space: pre-wrap;
      text-shadow: 1px 1px 2px #000;
    }

    /* 打字機閃爍光標 */
    .typing-cursor {
      display: inline-block;
      width: 10px;
      height: 1.3em;
      background-color: var(--highlight-color);
      vertical-align: middle;
      margin-left: 6px;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* 結局等級標籤 */
    .grade-badge {
      display: inline-block;
      font-family: 'Press Start 2P', cursive;
      font-size: 1.6rem;
      padding: 10px 20px;
      border-radius: 6px;
      margin-bottom: 18px;
      text-shadow: 2px 2px #000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .grade-SSR { background-color: #ff4757; color: #fff; border: 3px solid #ffa502; }
    .grade-SR { background-color: #1e90ff; color: #fff; border: 2px solid #70a1ff; }
    .grade-NORMAL { background-color: #747d8c; color: #fff; }
    .grade-BAD { background-color: #2f3542; color: #ff6b81; border: 2px solid #ff4757; }

    /* 大號按鈕控制區 */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 30;
      max-width: 950px;
      width: 100%;
      margin: 0 auto;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .btn {
      background-color: #2f3542;
      color: #fff;
      border: 3px solid var(--border-color);
      padding: 20px 16px;
      font-size: 1.25rem;
      font-weight: 900;
      font-family: inherit;
      cursor: pointer;
      border-radius: 6px;
      box-shadow: 0 6px 0 #000;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn:hover {
      background-color: var(--border-color);
      color: #000;
      transform: translateY(-3px);
      box-shadow: 0 9px 0 #000;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #000;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: 0 6px 0 #000 !important;
    }

    .btn-restart {
      grid-column: span 2;
      background-color: var(--success-color);
      border-color: #2ed573;
      color: #000;
      font-size: 1.4rem;
    }

    .btn-restart:hover {
      background-color: #26af5f;
      color: #fff;
    }

    @media (max-width: 650px) {
      .btn-group {
        grid-template-columns: 1fr;
      }
      .btn-restart {
        grid-column: span 1;
      }
      .stage-icon {
        font-size: 4.5rem;
      }
      .story-text {
        font-size: 1.1rem;
      }
      .game-title {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>

  <!-- 碎石特效 Canvas -->
  <canvas id="gravel-canvas"></canvas>

  <div class="game-container" id="game-container">
    <div class="header">
      <h1 class="game-title">像素祕寶迷宮</h1>
      <div class="status-bar">
        <span id="stage-indicator">STAGE: 1 / 3 (森林)</span>
        <span id="path-history">PATH: START</span>
      </div>
    </div>

    <!-- 點擊中央卡片跳過打字 -->
    <div class="stage-card" onclick="skipTypewriter()">
      <div id="grade-container"></div>
      <div class="stage-icon" id="stage-icon">🌲</div>
      <div class="story-text-container">
        <span class="story-text" id="story-text"></span><span class="typing-cursor" id="typing-cursor"></span>
      </div>
    </div>

    <div class="controls">
      <div class="btn-group" id="action-buttons">
        <button class="btn" onclick="makeChoice('L')">⬅️ 向左走</button>
        <button class="btn" onclick="makeChoice('R')">➡️ 向右走</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================
       1. 故事文本與數據結構 (含風格屬性)
       ========================================== */
    const storyTree = {
      "START": {
        stage: "1 / 3 (森林)",
        theme: "", // 森林風格 (預設)
        icon: "🌲",
        text: "你踏入迷霧籠罩的古老森林，前方深處隱約露出遺跡的入口。空氣中瀰漫著塵土與冒險的氣息，面前分出了兩條岔路...",
        leftBtn: "⬅️ 巨石通道",
        rightBtn: "➡️ 水晶溶洞"
      },
      // --- 第一輪分歧 (進入遺跡主題) ---
      "L": {
        stage: "2 / 3 (遺跡)",
        theme: "theme-ruins",
        icon: "🗿",
        text: "【巨石通道】踏入石造遺跡，牆上刻滿古老符文。走著走著來到巨大石門前，兩側各有一條狹窄走廊。",
        leftBtn: "⬅️ 探查古井",
        rightBtn: "➡️ 走向獸吼聲"
      },
      "R": {
        stage: "2 / 3 (遺跡)",
        theme: "theme-ruins",
        icon: "💎",
        text: "【水晶溶洞】發光的晶石照亮地底溶洞，景色絢麗卻暗藏殺機。懸崖邊有兩條古老步道可以跨越。",
        leftBtn: "⬅️ 祭壇走廊",
        rightBtn: "➡️ 瀑布吊橋"
      },
      // --- 第二輪分歧 (進入地底主題) ---
      "LL": {
        stage: "3 / 3 (地底)",
        theme: "theme-underground",
        icon: "🕳️",
        text: "【古井深處】深入地底深處，面前出現兩尊古老的守護者石像，各自伸出一隻手指向不同的石門。",
        leftBtn: "⬅️ 太陽黃金門",
        rightBtn: "➡️ 月亮青銅門"
      },
      "LR": {
        stage: "3 / 3 (地底)",
        theme: "theme-underground",
        icon: "🦇",
        text: "【獸吼狹道】狹道盡頭居然是一隻沉睡的巨型岩石怪！巨獸身後有兩個通往極深處的洞口。",
        leftBtn: "⬅️ 鑽左側狹縫",
        rightBtn: "➡️ 快速衝過右側"
      },
      "RL": {
        stage: "3 / 3 (地底)",
        theme: "theme-underground",
        icon: "🔮",
        text: "【祭壇走廊】祭壇中央擺著一本散發紫光的魔導書，左右兩側各有一個神秘機關按鈕。",
        leftBtn: "⬅️ 紅寶石按鈕(力量)",
        rightBtn: "➡️ 藍寶石按鈕(智慧)"
      },
      "RR": {
        stage: "3 / 3 (地底)",
        theme: "theme-underground",
        icon: "🌉",
        text: "【瀑布吊橋】吊橋搖搖欲墜，你驚險抵達對岸。面前出現兩條濕滑的地底石階梯。",
        leftBtn: "⬅️ 向上石階",
        rightBtn: "➡️ 向下石階"
      },

      // --- 第三輪：8 大最終結局 ---
      "LLL": {
        isEnding: true,
        theme: "theme-underground",
        grade: "SSR",
        icon: "👑",
        title: "失落的法老寶藏",
        text: "門後堆滿了黃金與古代法老的皇冠！你成功帶走無數財寶，成為世上最富有、最傳奇的冒險家！"
      },
      "LLR": {
        isEnding: true,
        theme: "theme-underground",
        grade: "BAD",
        icon: "⏳",
        title: "時光詛咒",
        text: "月亮石門觸發了古代時間陷阱！你的身體逐漸變成石頭，永遠成為了遺跡的一部分..."
      },
      "LRL": {
        isEnding: true,
        theme: "theme-underground",
        grade: "SR",
        icon: "🐾",
        title: "巨獸馴服者",
        text: "你靈巧地鑽過狹縫，意外發現了巨獸幼崽並給予餵食。巨獸醒來後將你視為主人，護送你帶滿口袋寶石平安離開！"
      },
      "LRR": {
        isEnding: true,
        theme: "theme-underground",
        grade: "BAD",
        icon: "🕳️",
        title: "陷阱坑洞",
        text: "你的腳步聲驚醒了巨獸！狂暴的巨獸一巴掌踩塌了地面，你落入無底深淵..."
      },
      "RLL": {
        isEnding: true,
        theme: "theme-underground",
        grade: "BAD",
        icon: "💥",
        title: "貪婪的代價",
        text: "紅寶石按鈕引爆了遺跡的自爆機關！強烈的地震讓整個洞穴坍塌，你與寶藏一同被埋葬。"
      },
      "RLR": {
        isEnding: true,
        theme: "theme-underground",
        grade: "SSR",
        icon: "🧙‍♂️",
        title: "大賢者傳承",
        text: "智慧按鈕開啟了法術試煉，你獲得了古代大賢者的畢生魔法傳承與無價的知識魔法書！"
      },
      "RRL": {
        isEnding: true,
        theme: "theme-underground",
        grade: "NORMAL",
        icon: "🏛️",
        title: "空無一物的密室",
        text: "向上走進密室，裡面只有空箱子與一張寫著「有人先來過了」的紙條。雖然沒拿到寶藏，但你平安無事地離開了。"
      },
      "RRR": {
        isEnding: true,
        theme: "theme-underground",
        grade: "SR",
        icon: "🧜‍♀️",
        title: "人魚之歌與地底湖",
        text: "向下的石階通往神秘的地底螢光湖，地底人魚贈予你一顆巨大的避水珍珠，賣出了無可估量的高價！"
      }
    };

    /* ==========================================
       2. 遊戲狀態與打字機邏輯
       ========================================== */
    let currentPath = "START";
    let typewriterTimer = null;
    let fullText = "";
    let isTyping = false;
    const typingSpeed = 35;

    // 啟動打字機效果
    function typeWriter(text, index = 0) {
      const textElement = document.getElementById('story-text');
      const cursorElement = document.getElementById('typing-cursor');
      
      if (index === 0) {
        textElement.textContent = "";
        cursorElement.style.display = "inline-block";
        isTyping = true;
        toggleButtons(true);
      }

      if (index < text.length) {
        textElement.textContent += text.charAt(index);
        typewriterTimer = setTimeout(() => {
          typeWriter(text, index + 1);
        }, typingSpeed);
      } else {
        isTyping = false;
        cursorElement.style.display = "none";
        toggleButtons(false);
      }
    }

    function skipTypewriter() {
      if (isTyping) {
        clearTimeout(typewriterTimer);
        document.getElementById('story-text').textContent = fullText;
        document.getElementById('typing-cursor').style.display = "none";
        isTyping = false;
        toggleButtons(false);
      }
    }

    function toggleButtons(disabled) {
      const buttons = document.querySelectorAll('#action-buttons button');
      buttons.forEach(btn => btn.disabled = disabled);
    }

    function renderNode() {
      if (typewriterTimer) clearTimeout(typewriterTimer);

      const node = storyTree[currentPath];
      fullText = node.text;

      // 切換背景主題風格
      document.body.className = node.theme || "";

      document.getElementById('stage-icon').textContent = node.icon;
      
      if (node.isEnding) {
        document.getElementById('stage-indicator').textContent = "STAGE: END";
        document.getElementById('path-history').textContent = `PATH: ${formatPath(currentPath)}`;
        
        document.getElementById('grade-container').innerHTML = 
          `<span class="grade-badge grade-${node.grade}">${node.grade} - ${node.title}</span>`;
        
        document.getElementById('action-buttons').innerHTML = 
          `<button class="btn btn-restart" onclick="restartGame()">🔄 重新開始冒險</button>`;
      } else {
        document.getElementById('stage-indicator').textContent = `STAGE: ${node.stage}`;
        document.getElementById('path-history').textContent = `PATH: ${formatPath(currentPath)}`;
        document.getElementById('grade-container').innerHTML = "";

        document.getElementById('action-buttons').innerHTML = `
          <button class="btn" onclick="makeChoice('L')">${node.leftBtn || "⬅️ 向左走"}</button>
          <button class="btn" onclick="makeChoice('R')">${node.rightBtn || "➡️ 向右走"}</button>
        `;
      }

      typeWriter(fullText);
    }

    function makeChoice(direction) {
      if (isTyping) return;
      
      // 觸發碎石掉落特效與震動
      triggerGravelEffect();
      triggerScreenShake();

      if (currentPath === "START") {
        currentPath = direction;
      } else {
        currentPath += direction;
      }
      renderNode();
    }

    function restartGame() {
      triggerGravelEffect();
      currentPath = "START";
      renderNode();
    }

    function formatPath(path) {
      if (path === "START") return "START";
      return path.split('').map(char => char === 'L' ? '⬅️' : '➡️').join(' ');
    }

    // 震動鏡頭
    function triggerScreenShake() {
      const container = document.getElementById('game-container');
      container.classList.remove('shake-animation');
      void container.offsetWidth; // 觸發重繪
      container.classList.add('shake-animation');
    }

    /* ==========================================
       3. Canvas 碎石粒子特效 (Gravel Debris FX)
       ========================================== */
    const canvas = document.getElementById('gravel-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = -20;
        this.size = Math.random() * 8 + 4; // 碎石大小
        this.speedY = Math.random() * 6 + 4;
        this.speedX = (Math.random() - 0.5) * 3;
        this.color = Math.random() > 0.5 ? '#888888' : '#555555';
        this.rotation = Math.random() * Math.PI * 2;
        this.spin = (Math.random() - 0.5) * 0.2;
      }

      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.rotation += this.spin;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.fillStyle = this.color;
        ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
        ctx.restore();
      }
    }

    function triggerGravelEffect() {
      // 產生 35 個碎石粒子
      for (let i = 0; i < 35; i++) {
        particles.push(new Particle());
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].y > canvas.height + 20) {
          particles.splice(i, 1);
        }
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // 遊戲初始化
    renderNode();
  </script>
</body>
</html>
